# nginx для медиаПространства.
#
# Копировать в /etc/nginx/sites-available/mediahub, заменить mediahub.example.ru
# на свой домен, затем:
#   ln -s /etc/nginx/sites-available/mediahub /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Сертификат ставится отдельно: certbot --nginx -d mediahub.example.ru.
# Он сам допишет сюда строки ssl_certificate и переадресацию с 80 порта.

server {
    listen 80;
    listen [::]:80;
    server_name mediahub.example.ru;

    # До выпуска сертификата certbot должен достучаться сюда по http.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mediahub.example.ru;

    # ssl_certificate и ssl_certificate_key допишет certbot.

    # Видео с мероприятий — обычное дело, и стандартного 1 МБ тут мало.
    # Значение должно быть не меньше того, что вы готовы принимать от волонтёров.
    client_max_body_size 512m;

    # Загрузка видео в ВК идёт с таймаутом до двух минут на файл, а тяжёлый
    # пост может содержать несколько. Короткие таймауты рвут запрос на
    # полпути — и человек видит ошибку там, где всё на самом деле шло.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Рейт-лимит и журнал действий берут адрес клиента отсюда. Заголовок
    # обязателен: без него все обращения выглядят пришедшими с localhost,
    # и ограничение на подбор пароля перестаёт работать вовсе.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # ── API ───────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # ── Загруженные файлы ─────────────────────────────────────────────────
    # Отдаёт приложение, а не nginx напрямую: доступ к файлу несёт подпись в
    # самой ссылке, и раздача каталога в обход приложения открыла бы все
    # загрузки всему интернету.
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # ── Проверка состояния для мониторинга ────────────────────────────────
    location = /api/health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # ── Интерфейс ─────────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    # Собранные ассеты Next.js неизменяемы: имя файла меняется вместе с
    # содержимым, поэтому их можно кэшировать надолго.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
