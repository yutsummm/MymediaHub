<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Аватар знака: искра на тёмном поле с точечной матрицей (components/Logo.tsx). -->
  <defs>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.9" fill="rgba(255,255,255,0.32)"/>
    </pattern>
    <clipPath id="plate">
      <rect width="48" height="48" rx="10"/>
    </clipPath>
  </defs>
  <g clip-path="url(#plate)">
    <rect width="48" height="48" fill="#0A0A0A"/>
    <rect width="48" height="48" fill="url(#dots)"/>
    <!-- Четырёхлучевая звезда: та же геометрия, что в знаке, в поле 100×100. -->
    <polygon points="50,0 59,41 100,50 59,59 50,100 41,59 0,50 41,41"
             fill="#fff" transform="translate(11 11) scale(0.26)"/>
  </g>
</svg>
