; Проверка типов.
;
; Лежит отдельным файлом, а не в pyproject.toml, — как pytest.ini и ruff.toml:
; наличие pyproject.toml меняет детект сборки в nixpacks на Railway.
;
; Строгость намеренно умеренная: цель не «аннотировать всё», а ловить те
; ошибки, которые уже случались в этом проекте, — перепутанные типы аргументов
; и обращение к результату fetchone(), который может оказаться None.
; check_untyped_defs включает проверку тел функций без аннотаций: без него
; половина роутеров не проверялась бы вовсе.

[mypy]
python_version = 3.11
; `request: Request = None` — идиома FastAPI, а не неточность: с аннотацией
; `Request | None` фреймворк принимает параметр за поле pydantic и падает при
; старте. Поэтому неявный Optional здесь разрешён сознательно.
implicit_optional = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
; У psycopg2, jose, bcrypt и прочего типов нет — требовать их бессмысленно.
ignore_missing_imports = True
exclude = (^\.venv/|^alembic/versions/|^uploads/)

; Миграции пишутся руками через op.*; проверять их типы смысла нет.
[mypy-alembic.*]
ignore_errors = True
